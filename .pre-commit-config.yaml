# Install once: `pipx install pre-commit && pre-commit install` (or `uvx pre-commit install`).
# Heavier checks (mypy, ESLint, tsc, tests) run in CI and via `make check`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: sh -c 'cd frontend && pnpm exec prettier --write --ignore-unknown "${@#frontend/}"' --
        files: ^frontend/
        exclude: ^frontend/(pnpm-lock\.yaml|src/types/api\.d\.ts)$
