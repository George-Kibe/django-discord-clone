{% extends "emails/base.html" %}
{% block title %}Your password was changed{% endblock %}
{% block content %}
<p style="margin:0 0 12px;font-size:16px;">Hi {{ name }},</p>
<p style="margin:0;font-size:15px;line-height:1.5;">The password for your account was just changed, and other sessions were signed out.</p>
<p style="margin:16px 0 0;font-size:15px;line-height:1.5;">If you didn't do this, <a href="{{ site_url }}/forgot-password" style="color:#5865f2;">reset your password</a> immediately.</p>
{% endblock %}
