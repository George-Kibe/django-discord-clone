openapi: 3.0.3
info:
  title: Discord Clone API
  version: 0.1.0
  description: REST API for the Discord clone. The WebSocket protocol is documented
    in docs/API.md.
paths:
  /api/health/live:
    get:
      operationId: api_health_live_retrieve
      description: Process is up. Used by Docker health checks; never touches dependencies.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/health/ready:
    get:
      operationId: api_health_ready_retrieve
      description: Dependencies (Postgres, Redis) are reachable.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the ``csrftoken`` cookie. The frontend calls this before its
        first write.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Always succeeds and clears cookies, even if the access token has
        already expired.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Rotates the refresh cookie and issues a new access cookie.

        CSRF-exempt: it only reads the httpOnly refresh cookie (path-restricted, SameSite=Lax) and
        returns nothing an attacker could read. Reuse of a rotated token revokes all sessions.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          description: token_not_valid
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/resend-verification:
    post:
      operationId: auth_resend_verification_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      description: Confirms an email verification or email-change link (the link may
        open in any browser).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/media/sign:
    post:
      operationId: media_sign_create
      description: Signed parameters for a direct browser upload to Cloudinary (ADR-010).
      tags:
      - media
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUploadRequestRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUploadResponse'
          description: ''
  /api/v1/meta:
    get:
      operationId: meta_retrieve
      description: Public build/environment info for the frontend.
      tags:
      - meta
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: ''
  /api/v1/users/{id}:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
          description: ''
  /api/v1/users/me:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: users_me_partial_update
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/users/me/avatar:
    put:
      operationId: users_me_avatar_update
      description: Attach an uploaded image (see POST /media/sign) as the avatar,
        or remove it.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: users_me_avatar_destroy
      description: Attach an uploaded image (see POST /media/sign) as the avatar,
        or remove it.
      tags:
      - users
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users/me/email:
    post:
      operationId: users_me_email_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
  schemas:
    AvatarRequest:
      type: object
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - public_id
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailChangeRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - new_email
      - password
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        checks:
          type: object
          additionalProperties:
            type: string
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Me:
      type: object
      description: The signed-in user's own profile (response shape).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        status:
          allOf:
          - $ref: '#/components/schemas/UserStatusEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - avatar_url
      - bio
      - date_joined
      - display_name
      - email
      - email_verified
      - id
      - status
      - username
    Meta:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
      required:
      - environment
      - name
      - version
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 128
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - token
      - uid
    PatchedMeUpdateRequest:
      type: object
      description: PATCH /users/me input. Responses use MeSerializer.
      properties:
        username:
          type: string
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          maxLength: 32
        display_name:
          type: string
          maxLength: 64
        bio:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/UserStatusEnum'
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_url
      - bio
      - date_joined
      - display_name
      - id
      - username
    PurposeEnum:
      enum:
      - avatar
      type: string
      description: '* `avatar` - avatar'
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        username:
          type: string
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          maxLength: 32
        display_name:
          type: string
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
      - username
    SignUploadRequestRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
      required:
      - filename
      - purpose
      - size
    SignUploadResponse:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
        api_key:
          type: string
        signature:
          type: string
        public_id:
          type: string
        timestamp:
          type: integer
        allowed_formats:
          type: string
        overwrite:
          type: string
      required:
      - allowed_formats
      - api_key
      - overwrite
      - public_id
      - signature
      - timestamp
      - upload_url
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - token
    UserStatusEnum:
      enum:
      - online
      - idle
      - dnd
      - invisible
      type: string
      description: |-
        * `online` - Online
        * `idle` - Idle
        * `dnd` - Do not disturb
        * `invisible` - Invisible
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtCookieAuth:
      type: apiKey
      in: cookie
      name: access
      description: httpOnly access JWT set by POST /api/v1/auth/login (ADR-006).
