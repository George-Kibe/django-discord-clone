openapi: 3.0.3
info:
  title: Discord Clone API
  version: 0.1.0
  description: REST API for the Discord clone. The WebSocket protocol is documented
    in docs/API.md.
paths:
  /api/health/live:
    get:
      operationId: api_health_live_retrieve
      description: Process is up. Used by Docker health checks; never touches dependencies.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/health/ready:
    get:
      operationId: api_health_ready_retrieve
      description: Dependencies (Postgres, Redis) are reachable.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the ``csrftoken`` cookie. The frontend calls this before its
        first write.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Always succeeds and clears cookies, even if the access token has
        already expired.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Rotates the refresh cookie and issues a new access cookie.

        CSRF-exempt: it only reads the httpOnly refresh cookie (path-restricted, SameSite=Lax) and
        returns nothing an attacker could read. Reuse of a rotated token revokes all sessions.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          description: token_not_valid
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/resend-verification:
    post:
      operationId: auth_resend_verification_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      description: Confirms an email verification or email-change link (the link may
        open in any browser).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/categories/{category_id}:
    patch:
      operationId: categories_partial_update
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/channels/{channel_id}:
    get:
      operationId: channels_retrieve
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    patch:
      operationId: channels_partial_update
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannelUpdateRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    delete:
      operationId: channels_destroy
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/channels/{channel_id}/ack:
    post:
      operationId: channels_ack_create
      summary: Mark the channel read up to a message
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadState'
          description: ''
  /api/v1/channels/{channel_id}/messages:
    get:
      operationId: channels_messages_retrieve
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: 'Message id: newer messages, oldest first'
      - in: query
        name: before
        schema:
          type: string
        description: 'Message id: older messages, newest first'
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-100, default 50
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: channels_messages_create
      description: A repeated `nonce` returns the original message with 200 (idempotent
        retry).
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageWriteRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/channels/{channel_id}/overwrites:
    get:
      operationId: channels_overwrites_list
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
