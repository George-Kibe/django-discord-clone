      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMessageEditRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    delete:
      operationId: messages_destroy
