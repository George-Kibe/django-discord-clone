      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetail'
          description: ''
  /api/v1/media/sign:
    post:
      operationId: media_sign_create
      description: Signed parameters for a direct browser upload to Cloudinary (ADR-010).
      tags:
      - media
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUploadRequestRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUploadResponse'
          description: ''
  /api/v1/messages/{message_id}:
    patch:
      operationId: messages_partial_update
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMessageEditRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    delete:
      operationId: messages_destroy
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/messages/{message_id}/pin:
    put:
      operationId: messages_pin_update
      summary: Pin a message
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    delete:
      operationId: messages_pin_destroy
      summary: Unpin a message
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/messages/{message_id}/reactions/{emoji}:
    get:
      operationId: messages_reactions_retrieve
      summary: Who reacted
      parameters:
      - in: path
        name: emoji
        schema:
          type: string
        required: true
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionUsers'
          description: ''
    put:
      operationId: messages_reactions_update
      summary: Add your reaction
      parameters:
      - in: path
        name: emoji
        schema:
          type: string
        required: true
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
