components:
  schemas:
    AckRequest:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
      required:
      - message_id
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        is_image:
          type: boolean
          readOnly: true
        url:
          type: string
          nullable: true
          readOnly: true
        preview_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - content_type
      - filename
      - height
      - id
      - is_image
      - preview_url
      - size_bytes
      - url
      - width
    AttachmentRefRequest:
      type: object
      properties:
        public_id:
          type: string
          minLength: 1
          description: From POST /media/sign (purpose=attachment), uploaded.
          maxLength: 255
        filename:
          type: string
          minLength: 1
          description: The original file name.
          maxLength: 255
      required:
      - filename
      - public_id
    AvatarRequest:
      type: object
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - public_id
    BlockRequestRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
      required:
      - user_id
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        position:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - position
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        server_id:
          type: string
          format: uuid
          readOnly: true
        category_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/ChannelTypeEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        topic:
          type: string
          readOnly: true
        position:
          type: integer
          readOnly: true
        slowmode_seconds:
          type: integer
          readOnly: true
        permissions:
          type: integer
