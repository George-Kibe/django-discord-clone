        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
          description: ''
    delete:
      operationId: invites_destroy
      summary: Revoke an invite
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - servers
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/invites/{code}/accept:
    post:
      operationId: invites_accept_create
      parameters:
