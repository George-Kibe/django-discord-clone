        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
          description: ''
  /api/v1/dms/{dm_id}/participants/{user_id}:
    delete:
      operationId: dms_participants_destroy
      summary: Leave, or remove someone (owner)
      parameters:
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dms
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/dms/{dm_id}/pins:
    get:
      operationId: dms_pins_list
      parameters:
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dms
      security:
