        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/meta:
    get:
      operationId: meta_retrieve
      description: Public build/environment info for the frontend.
      tags:
      - meta
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
