      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Overwrite'
          description: ''
    put:
      operationId: channels_overwrites_update
      summary: Create or replace an overwrite
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverwriteWriteRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overwrite'
          description: ''
  /api/v1/channels/{channel_id}/overwrites/{overwrite_id}:
    delete:
      operationId: channels_overwrites_destroy
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: overwrite_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/invites/{code}:
    get:
      operationId: invites_retrieve
      summary: Invite preview (public)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - servers
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
          description: ''
    delete:
      operationId: invites_destroy
      summary: Revoke an invite
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - servers
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/invites/{code}/accept:
    post:
