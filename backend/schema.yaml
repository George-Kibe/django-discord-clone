openapi: 3.0.3
info:
  title: Discord Clone API
  version: 0.1.0
  description: REST API for the Discord clone. The WebSocket protocol is documented
    in docs/API.md.
paths:
  /api/health/live:
    get:
      operationId: api_health_live_retrieve
      description: Process is up. Used by Docker health checks; never touches dependencies.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/health/ready:
    get:
      operationId: api_health_ready_retrieve
      description: Dependencies (Postgres, Redis) are reachable.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the ``csrftoken`` cookie. The frontend calls this before its
        first write.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Always succeeds and clears cookies, even if the access token has
        already expired.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Rotates the refresh cookie and issues a new access cookie.

        CSRF-exempt: it only reads the httpOnly refresh cookie (path-restricted, SameSite=Lax) and
        returns nothing an attacker could read. Reuse of a rotated token revokes all sessions.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          description: token_not_valid
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/resend-verification:
    post:
      operationId: auth_resend_verification_create
      description: 'Base for public auth endpoints: no authentication, CSRF enforced
        on writes, IP throttled.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      description: Confirms an email verification or email-change link (the link may
        open in any browser).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/categories/{category_id}:
    patch:
      operationId: categories_partial_update
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/channels/{channel_id}:
    get:
      operationId: channels_retrieve
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    patch:
      operationId: channels_partial_update
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannelUpdateRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    delete:
      operationId: channels_destroy
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/channels/{channel_id}/ack:
    post:
      operationId: channels_ack_create
      summary: Mark the channel read up to a message
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadState'
          description: ''
  /api/v1/channels/{channel_id}/messages:
    get:
      operationId: channels_messages_retrieve
      description: History + send, shared by channels and DMs.
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: 'Message id: newer messages, oldest first'
      - in: query
        name: before
        schema:
          type: string
        description: 'Message id: older messages, newest first'
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-100, default 50
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: channels_messages_create
      description: A repeated `nonce` returns the original message with 200 (idempotent
        retry).
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageWriteRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/channels/{channel_id}/overwrites:
    get:
      operationId: channels_overwrites_list
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Overwrite'
          description: ''
    put:
      operationId: channels_overwrites_update
      summary: Create or replace an overwrite
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverwriteWriteRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overwrite'
          description: ''
  /api/v1/channels/{channel_id}/overwrites/{overwrite_id}:
    delete:
      operationId: channels_overwrites_destroy
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: overwrite_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - channels
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/channels/{channel_id}/pins:
    get:
      operationId: channels_pins_list
      parameters:
      - in: path
        name: channel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - messages
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/dms:
    get:
      operationId: dms_list
      tags:
      - dms
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DMConversation'
          description: ''
    post:
      operationId: dms_create
      description: 'One user: returns the existing 1:1 conversation (200) or creates
        it (201).'
      tags:
      - dms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DMCreateRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
          description: ''
  /api/v1/dms/{dm_id}:
    get:
      operationId: dms_retrieve
      parameters:
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dms
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
          description: ''
    patch:
      operationId: dms_partial_update
      parameters:
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDMUpdateRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMConversation'
          description: ''
  /api/v1/dms/{dm_id}/ack:
    post:
      operationId: dms_ack_create
      parameters:
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DMAckRequestRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMAck'
          description: ''
  /api/v1/dms/{dm_id}/messages:
    get:
      operationId: dms_messages_retrieve
      description: History + send, shared by channels and DMs.
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: 'Message id: newer messages, oldest first'
      - in: query
        name: before
        schema:
          type: string
        description: 'Message id: older messages, newest first'
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-100, default 50
      tags:
      - dms
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: dms_messages_create
      description: History + send, shared by channels and DMs.
      parameters:
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageWriteRequest'
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/dms/{dm_id}/messages/search:
    get:
      operationId: dms_messages_search_retrieve
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: author
        schema:
          type: string
        description: User id
      - in: query
        name: before
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: channel
        schema:
          type: string
        description: Channel id (server search)
      - in: query
        name: cursor
        schema:
          type: string
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: has
        schema:
          type: string
          enum:
          - attachment
          - file
          - image
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-50, default 25
      - in: query
        name: q
        schema:
          type: string
        description: 'Words or phrases (web-search syntax: "quotes", -not)'
      tags:
      - dms
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultPage'
          description: ''
  /api/v1/dms/{dm_id}/participants:
    post:
      operationId: dms_participants_create
      parameters:
      - in: path
        name: dm_id
        schema:
          type: string
          format: uuid
