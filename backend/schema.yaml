components:
  schemas:
    AckRequest:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
      required:
      - message_id
    AvatarRequest:
      type: object
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - public_id
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        position:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - position
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        server_id:
          type: string
          format: uuid
          readOnly: true
        category_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/ChannelTypeEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        topic:
          type: string
          readOnly: true
        position:
          type: integer
          readOnly: true
        slowmode_seconds:
          type: integer
          readOnly: true
        permissions:
          type: integer
          readOnly: true
          description: Your effective permissions here.
      required:
      - category_id
      - id
      - name
      - permissions
      - position
      - server_id
      - slowmode_seconds
      - topic
      - type
    ChannelOrderItemRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        position:
          type: integer
          minimum: 0
      required:
      - category_id
      - id
      - position
    ChannelTypeEnum:
      enum:
      - text
      type: string
      description: '* `text` - Text'
    ChannelWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        topic:
          type: string
          maxLength: 1024
        category_id:
          type: string
          format: uuid
          nullable: true
        slowmode_seconds:
          type: integer
          maximum: 21600
          minimum: 0
      required:
      - name
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailChangeRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - new_email
      - password
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        checks:
          type: object
          additionalProperties:
            type: string
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    Invite:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        server_id:
          type: string
          format: uuid
          readOnly: true
        inviter:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        max_uses:
          type: integer
          readOnly: true
          nullable: true
        uses:
          type: integer
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - expires_at
      - inviter
      - max_uses
      - server_id
      - uses
    InviteCreateRequest:
      type: object
      properties:
        max_age:
          allOf:
          - $ref: '#/components/schemas/MaxAgeEnum'
          default: 604800
          description: |-
            Seconds; 0 = never.

            * `0` - 0
            * `1800` - 1800
            * `3600` - 3600
            * `21600` - 21600
            * `43200` - 43200
            * `86400` - 86400
            * `604800` - 604800
        max_uses:
          type: integer
          maximum: 100
          minimum: 0
          default: 0
          description: 0 = unlimited.
    InvitePreview:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        server:
          allOf:
          - $ref: '#/components/schemas/InviteServer'
          readOnly: true
        inviter:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - code
      - expires_at
      - inviter
      - server
    InviteServer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        icon_url:
          type: string
          nullable: true
          readOnly: true
        member_count:
          type: integer
          readOnly: true
      required:
      - description
      - icon_url
      - id
      - member_count
      - name
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    MaxAgeEnum:
      enum:
      - 0
      - 1800
      - 3600
      - 21600
      - 43200
      - 86400
      - 604800
      type: integer
      description: |-
        * `0` - 0
        * `1800` - 1800
        * `3600` - 3600
        * `21600` - 21600
        * `43200` - 43200
        * `86400` - 86400
        * `604800` - 604800
    Me:
      type: object
      description: The signed-in user's own profile (response shape).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        status:
          allOf:
          - $ref: '#/components/schemas/UserStatusEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - avatar_url
      - bio
      - date_joined
      - display_name
      - email
      - email_verified
      - id
      - status
      - username
    Member:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        nickname:
          type: string
          readOnly: true
        role_ids:
          type: array
          items:
            type: string
          readOnly: true
        is_owner:
          type: boolean
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        presence:
          allOf:
          - $ref: '#/components/schemas/PresenceEnum'
          description: online, idle, dnd or offline (invisible users appear offline).
          readOnly: true
      required:
      - is_owner
      - joined_at
      - nickname
      - presence
      - role_ids
      - user
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel_id:
          type: string
          format: uuid
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/MessageTypeEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        nonce:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - author
      - channel_id
      - content
      - created_at
      - edited_at
      - id
      - nonce
      - type
    MessagePage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
      required:
      - has_more
      - results
    MessageTypeEnum:
      enum:
      - default
      - system
      type: string
      description: |-
        * `default` - Default
        * `system` - System
    MessageWriteRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        nonce:
          type: string
          nullable: true
          maxLength: 64
      required:
      - content
    Meta:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
      required:
      - environment
      - name
      - version
    MutualServer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon_url:
          type: string
          nullable: true
      required:
      - icon_url
      - id
      - name
    MyMembership:
      type: object
      properties:
        is_owner:
          type: boolean
        permissions:
          type: integer
          description: Effective server-level permission bitfield.
        role_ids:
          type: array
          items:
            type: string
            format: uuid
        nickname:
          type: string
      required:
      - is_owner
      - nickname
      - permissions
      - role_ids
    Overwrite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        user_id:
          type: string
          nullable: true
          readOnly: true
        allow:
          type: integer
          readOnly: true
        deny:
          type: integer
          readOnly: true
      required:
      - allow
      - deny
      - id
      - role_id
      - user_id
    OverwriteWriteRequest:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        allow:
          type: integer
        deny:
          type: integer
      required:
      - allow
      - deny
    PaginatedMemberList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 128
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - token
      - uid
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    PatchedChannelReorderRequest:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelOrderItemRequest'
    PatchedChannelUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        topic:
          type: string
          maxLength: 1024
        category_id:
          type: string
          format: uuid
          nullable: true
        slowmode_seconds:
          type: integer
          maximum: 21600
          minimum: 0
    PatchedMeUpdateRequest:
      type: object
      description: PATCH /users/me input. Responses use MeSerializer.
      properties:
        username:
          type: string
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          maxLength: 32
        display_name:
          type: string
          maxLength: 64
        bio:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/UserStatusEnum'
    PatchedMemberUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 32
        role_ids:
          type: array
          items:
            type: string
            format: uuid
    PatchedMessageEditRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
    PatchedRoleReorderRequest:
      type: object
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Highest first.
    PatchedRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: integer
          maximum: 2147483647
          minimum: 0
        permissions:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        mentionable:
          type: boolean
        hoist:
          type: boolean
    PatchedServerUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        icon_public_id:
          type: string
          maxLength: 255
        is_public:
          type: boolean
        topic_id:
          type: integer
          nullable: true
    PermissionInfo:
      type: object
      properties:
        name:
          type: string
        value:
          type: integer
        description:
          type: string
      required:
      - description
      - name
      - value
    PresenceEnum:
      enum:
      - online
      - idle
      - dnd
      - offline
      type: string
    PurposeEnum:
      enum:
      - avatar
      - server_icon
      type: string
      description: |-
        * `avatar` - avatar
        * `server_icon` - server_icon
    ReadState:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        last_message_id:
          type: string
          format: uuid
          nullable: true
        last_read_message_id:
          type: string
          format: uuid
          nullable: true
        mention_count:
          type: integer
      required:
      - channel_id
      - last_message_id
      - last_read_message_id
      - mention_count
      - server_id
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        username:
          type: string
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          maxLength: 32
        display_name:
          type: string
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
      - username
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        color:
          type: integer
          maximum: 2147483647
          minimum: 0
        position:
          type: integer
          readOnly: true
        permissions:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        is_default:
          type: boolean
          readOnly: true
        mentionable:
          type: boolean
        hoist:
          type: boolean
      required:
      - id
      - is_default
      - name
      - position
    RoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: integer
          maximum: 2147483647
          minimum: 0
        permissions:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        mentionable:
          type: boolean
        hoist:
          type: boolean
      required:
      - name
    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        icon_url:
          type: string
          nullable: true
          readOnly: true
        owner_id:
          type: string
          format: uuid
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/Topic'
          readOnly: true
        is_public:
          type: boolean
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - icon_url
      - id
      - is_public
      - member_count
      - name
      - owner_id
      - topic
    ServerCreateRequest:
