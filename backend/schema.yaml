          description: ''
  /api/v1/media/sign:
    post:
      operationId: media_sign_create
      description: Signed parameters for a direct browser upload to Cloudinary (ADR-010).
      tags:
      - media
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUploadRequestRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUploadResponse'
          description: ''
  /api/v1/messages/{message_id}:
    patch:
      operationId: messages_partial_update
      parameters:
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
