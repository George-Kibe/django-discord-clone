# Development overrides: hot reload, bind mounts, exposed ports, Mailpit.

x-backend-dev: &backend-dev
  build:
    context: ./backend
    target: dev
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: discord-clone-api:dev
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
  volumes:
    - ./backend:/app

services:
  caddy:
    ports:
      - "${HTTP_PORT:-80}:80"

  web:
    build:
      context: ./frontend
      target: dev
    image: discord-clone-web:dev
    environment:
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    volumes:
      - ./frontend:/app
      - ./backend/schema.yaml:/backend/schema.yaml:ro  # for `pnpm gen:api` inside the container
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    healthcheck:
      disable: true

  api:
    <<: *backend-dev

  worker:
    <<: *backend-dev

  beat:
    <<: *backend-dev

  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    command: ["redis-server", "--appendonly", "no"]

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  web_node_modules:
  web_next:
