# Development overrides: hot reload, bind mounts, exposed ports, Mailpit.

x-backend-dev: &backend-dev
  build:
    context: ./backend
    target: dev
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: discord-clone-api:dev
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    # Test-domain recipients (example.com, *.test) are always captured by Mailpit (E2E reads it).
    # Real addresses go through EMAIL_URL or SENDER_EMAIL/EMAIL_PASSWORD from .env, or also
    # to Mailpit when neither is set.
    DEV_CAPTURE_EMAIL_URL: smtp://mailpit:1025
  volumes:
    - ./backend:/app

services:
  caddy:
    ports:
      - "${HTTP_PORT:-80}:80"

  web:
    build:
      context: ./frontend
      target: dev
    image: discord-clone-web:dev
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000" # frontend directly (dev proxies /api, /ws to Django)
    environment:
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    volumes:
      - ./frontend:/app
      - ./backend/schema.yaml:/backend/schema.yaml:ro  # for `pnpm gen:api` inside the container
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    healthcheck:
      # Static file: answers without triggering a dev-mode page compile.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    <<: *backend-dev
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000" # Django directly: /api/docs/, /admin/, /ws/

  worker:
    <<: *backend-dev

  beat:
    <<: *backend-dev

  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    command: ["redis-server", "--appendonly", "no"]

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  web_node_modules:
  web_next:
