# Production overrides (single VPS, ADR-013). Used by infra/scripts/deploy.sh:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Images come from GHCR (IMAGE_TAG = git SHA or release version); nothing is built on the server.

x-limits: &small
  deploy:
    resources:
      limits:
        memory: 128M

services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${DOMAIN:?set DOMAIN in .env}
      # Start with 1 day (matches Django's DJANGO_SECURE_HSTS_SECONDS); raise to a year once stable.
      HSTS_VALUE: ${HSTS_VALUE:-max-age=86400; includeSubDomains}
    <<: *small

  web:
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    deploy:
      resources:
        limits:
          memory: 512M

  beat:
    <<: *small

  db:
    # Sized for a 4 GB host shared with the app (docs/DEPLOYMENT.md §4).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=500
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction # never drop queued Celery jobs
    deploy:
      resources:
        limits:
          memory: 320M

  backup:
    image: ghcr.io/george-kibe/discord-clone-backup:${IMAGE_TAG:-local}
    build:
      context: ./infra/backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-app}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/scheduler.alive"]
      interval: 60s
      timeout: 5s
      retries: 3
    <<: *small
